<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iglesia de Cristo — Hunter, Arequipa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--white:#f8f7f4;--g1:#1a1a1a;--g2:#2e2e2e;--g3:#5a5a5a;--g4:#8a8a8a;--g5:#c8c8c8;--g6:#e8e7e4;--accent:#b8a98a;--adark:#7a6a4a;--fd:'Cormorant Garamond',serif;--fb:'DM Sans',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--white);color:var(--black);font-family:var(--fb);font-weight:300;line-height:1.7;overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.2rem 4rem;background:rgba(248,247,244,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--g6);}
.nav-logo{font-family:var(--fd);font-size:1rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--black);text-decoration:none;}
.nav-logo span{color:var(--adark);}
.nav-links{display:flex;gap:2rem;list-style:none;}
.nav-links a{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--g3);text-decoration:none;transition:color .2s;cursor:pointer;}
.nav-links a:hover{color:var(--black);}
.nav-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:.2rem;}
.nav-toggle span{width:24px;height:1.5px;background:var(--black);display:block;}
.admin-btn{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:.4rem .9rem;border:1px solid var(--adark);color:var(--adark);background:transparent;cursor:pointer;font-family:var(--fb);transition:all .2s;}
.admin-btn:hover{background:var(--adark);color:var(--white);}
#inicio{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;padding-top:72px;}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:6rem 4rem;}
.hero-tag{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--adark);margin-bottom:1.5rem;opacity:0;animation:fadeUp .8s .2s forwards;}
.hero-title{font-family:var(--fd);font-size:clamp(2.8rem,5vw,5.2rem);font-weight:300;line-height:1.1;margin-bottom:.6rem;opacity:0;animation:fadeUp .8s .4s forwards;}
.hero-title em{font-style:italic;color:var(--adark);}
.hero-location{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--g3);margin-bottom:1.5rem;opacity:0;animation:fadeUp .8s .5s forwards;}
.hero-subtitle{font-size:1rem;color:var(--g3);max-width:38ch;margin-bottom:3rem;opacity:0;animation:fadeUp .8s .6s forwards;}
.hero-verse{border-left:2px solid var(--accent);padding-left:1.2rem;font-family:var(--fd);font-style:italic;font-size:1.05rem;color:var(--g3);opacity:0;animation:fadeUp .8s .8s forwards;}
.hero-verse cite{display:block;font-style:normal;font-family:var(--fb);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--adark);margin-top:.5rem;}
.hero-right{background:var(--black);position:relative;overflow:hidden;opacity:0;animation:fadeIn 1.2s .3s forwards;}
.hero-cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.hero-cross svg{width:180px;height:180px;opacity:.1;}
.hero-grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(184,169,138,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(184,169,138,.06) 1px,transparent 1px);background-size:60px 60px;}
.hero-right-text{position:absolute;bottom:3rem;left:3rem;right:3rem;}
.hero-right-label{font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:.8rem;}
.hero-right-quote{font-family:var(--fd);font-size:1.5rem;font-weight:300;color:var(--white);line-height:1.35;}
.verse-ref{display:block;font-size:.85rem;color:var(--accent);margin-top:.5rem;font-family:var(--fb);font-style:normal;}
section{padding:7rem 4rem;}
.section-label{font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:var(--adark);margin-bottom:.8rem;}
.section-title{font-family:var(--fd);font-size:clamp(2rem,3.5vw,3.2rem);font-weight:300;line-height:1.15;margin-bottom:3rem;}
.section-title em{font-style:italic;}
#horarios{background:var(--black);color:var(--white);}
#horarios .section-title{color:var(--white);}
#horarios .section-label{color:var(--accent);}
.horarios-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5px;background:var(--g2);border:1.5px solid var(--g2);}
.horario-card{background:var(--g1);padding:2.5rem 2rem;transition:background .3s;}
.horario-card:hover{background:var(--g2);}
.horario-day{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem;}
.horario-name{font-family:var(--fd);font-size:1.5rem;font-weight:300;color:var(--white);margin-bottom:.3rem;}
.horario-time{font-size:1.7rem;font-weight:500;letter-spacing:-.02em;color:var(--white);margin-bottom:.8rem;}
.horario-desc{font-size:.85rem;color:var(--g4);line-height:1.6;}
.horario-badge{display:inline-block;padding:.15rem .6rem;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--g3);color:var(--g4);margin-bottom:.6rem;}
#programa{background:var(--white);}
.prog-titulo{font-family:var(--fd);font-size:clamp(2rem,3.5vw,3.2rem);font-weight:300;line-height:1.15;margin-bottom:3rem;}
.prog-titulo em{font-style:italic;}
.programa-filter{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:3rem;}
.filter-btn{padding:.4rem 1rem;font-family:var(--fb);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--g5);background:transparent;color:var(--g3);cursor:pointer;transition:all .2s;}
.filter-btn:hover,.filter-btn.active{background:var(--black);border-color:var(--black);color:var(--white);}
.programa-table{width:100%;border-collapse:collapse;}
.programa-table thead tr{border-bottom:2px solid var(--black);}
.programa-table th{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--g4);padding:.8rem 1rem;text-align:left;font-weight:400;}
.programa-table td{padding:1.1rem 1rem;font-size:.9rem;border-bottom:1px solid var(--g6);color:var(--g2);vertical-align:middle;}
.programa-table tr:hover td{background:var(--g6);}
.evento-tipo{display:inline-block;padding:.2rem .7rem;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid;}
.tipo-culto{border-color:var(--black);color:var(--black);}
.tipo-estudio{border-color:var(--adark);color:var(--adark);}
.tipo-especial{border-color:#2a5c8a;color:#2a5c8a;}
.tipo-comunion{border-color:#7a3a3a;color:#7a3a3a;}
.programa-row.hidden{display:none;}
#estudios{background:var(--black);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:60vh;}
#estudios .section-label{color:var(--accent);}
.estudios-hero-title{font-family:var(--fd);font-size:clamp(3rem,6vw,6.5rem);font-weight:300;line-height:1.05;color:var(--white);margin-bottom:1.2rem;}
.estudios-hero-title em{font-style:italic;color:var(--accent);}
.estudios-hero-sub{font-size:1rem;color:var(--g4);max-width:44ch;margin:0 auto 3rem;}
.estudios-cta{display:inline-flex;align-items:center;gap:.8rem;padding:1rem 2.5rem;border:1px solid var(--accent);color:var(--accent);font-family:var(--fb);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;background:transparent;transition:all .3s;}
.estudios-cta:hover{background:var(--accent);color:var(--black);}
.estudios-cta svg{width:16px;height:16px;transition:transform .3s;}
.estudios-cta:hover svg{transform:translateX(4px);}
.estudios-count{margin-top:2rem;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--g3);}
#galeria{background:var(--white);}
.galeria-intro{max-width:50ch;color:var(--g3);font-size:.95rem;margin-bottom:3rem;}
.galeria-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:200px 200px;gap:3px;}
.galeria-item{background:var(--g2);position:relative;overflow:hidden;cursor:pointer;}
.galeria-item:first-child{grid-column:span 2;grid-row:span 2;}
.galeria-item img{width:100%;height:100%;object-fit:cover;display:block;}
.galeria-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.5rem;}
.galeria-placeholder svg{opacity:.15;}
.galeria-placeholder span{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--g4);}
.galeria-overlay{position:absolute;inset:0;background:var(--black);opacity:0;transition:opacity .3s;}
.galeria-item:hover .galeria-overlay{opacity:.5;}
#contacto{background:var(--black);color:var(--white);}
#contacto .section-title{color:var(--white);}
#contacto .section-label{color:var(--accent);}
.contacto-grid{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start;}
.contacto-item{display:flex;gap:1.2rem;margin-bottom:1.8rem;align-items:flex-start;}
.contacto-icon{width:36px;height:36px;border:1px solid var(--g2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:.15rem;}
.contacto-icon svg{width:16px;height:16px;stroke:var(--accent);fill:none;}
.c-label{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.3rem;}
.c-val{font-size:.9rem;color:var(--g5);line-height:1.5;}
.map-wrap{margin-top:1.5rem;border:1px solid var(--g2);overflow:hidden;line-height:0;}
.map-wrap iframe{width:100%;height:230px;border:none;display:block;}
.map-link{display:inline-flex;align-items:center;gap:.5rem;margin-top:.8rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-decoration:none;transition:color .2s;}
.map-link:hover{color:var(--white);}
.form-group{margin-bottom:1.4rem;}
.form-label{display:block;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--g4);margin-bottom:.5rem;}
.form-input,.form-textarea{width:100%;background:var(--g1);border:1px solid var(--g2);color:var(--white);font-family:var(--fb);font-size:.9rem;padding:.9rem 1rem;outline:none;transition:border-color .2s;resize:none;}
.form-input:focus,.form-textarea:focus{border-color:var(--accent);}
.form-textarea{height:110px;}
.btn-submit{width:100%;padding:1rem;background:var(--white);color:var(--black);border:none;font-family:var(--fb);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s;}
.btn-submit:hover{background:var(--accent);color:var(--white);}
.form-success{display:none;padding:1rem;background:rgba(184,169,138,.15);border:1px solid var(--accent);color:var(--accent);font-size:.85rem;text-align:center;margin-top:1rem;}
footer{background:var(--black);border-top:1px solid var(--g2);padding:2rem 4rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.footer-logo{font-family:var(--fd);font-size:1rem;color:var(--white);letter-spacing:.06em;}
.footer-logo span{color:var(--accent);}
.footer-copy{font-size:.72rem;color:var(--g4);}
.footer-verse{font-family:var(--fd);font-style:italic;font-size:.85rem;color:var(--g4);}

/* ESTUDIOS PAGE */
#estudiosPage{display:none;position:fixed;inset:0;z-index:500;background:var(--white);overflow-y:auto;}
#estudiosPage.open{display:block;}
.ep-nav{position:sticky;top:0;background:rgba(248,247,244,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--g6);padding:1rem 4rem;display:flex;align-items:center;justify-content:space-between;z-index:10;}
.ep-nav-logo{font-family:var(--fd);font-size:1rem;font-weight:600;color:var(--black);}
.ep-nav-logo span{color:var(--adark);}
.ep-back{display:flex;align-items:center;gap:.5rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--g3);cursor:pointer;border:none;background:transparent;font-family:var(--fb);transition:color .2s;}
.ep-back:hover{color:var(--black);}
.ep-hero{background:var(--black);padding:6rem 4rem 5rem;text-align:center;position:relative;overflow:hidden;}
.ep-hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(184,169,138,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(184,169,138,.04) 1px,transparent 1px);background-size:50px 50px;}
.ep-hero-label{font-size:.68rem;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem;position:relative;}
.ep-hero-title{font-family:var(--fd);font-size:clamp(3rem,6vw,6rem);font-weight:300;color:var(--white);line-height:1.05;margin-bottom:1rem;position:relative;}
.ep-hero-title em{font-style:italic;color:var(--accent);}
.ep-hero-sub{font-size:1rem;color:var(--g4);max-width:48ch;margin:0 auto;position:relative;}
.ep-filter-bar{padding:1.5rem 4rem;display:flex;gap:.5rem;flex-wrap:wrap;border-bottom:1px solid var(--g6);}
.ep-filter{padding:.35rem .9rem;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--g5);background:transparent;color:var(--g3);cursor:pointer;font-family:var(--fb);transition:all .2s;}
.ep-filter:hover,.ep-filter.active{background:var(--black);border-color:var(--black);color:var(--white);}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2px;background:var(--g6);padding:2px;margin:2rem 4rem 4rem;}
.ep-card{background:var(--white);cursor:pointer;transition:transform .25s,box-shadow .25s;}
.ep-card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.12);}
.ep-card-header{background:var(--black);padding:2rem 2rem 1.5rem;position:relative;overflow:hidden;}
.ep-card-header::after{content:'';position:absolute;bottom:-20px;right:-20px;width:80px;height:80px;border:1px solid rgba(184,169,138,.15);border-radius:50%;}
.ep-card-num{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.6rem;}
.ep-card-title{font-family:var(--fd);font-size:1.55rem;font-weight:300;color:var(--white);line-height:1.2;}
.ep-card-pasaje{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--g4);margin-top:.5rem;}
.ep-card-body{padding:1.5rem 2rem 2rem;}
.ep-card-desc{font-size:.9rem;color:var(--g3);line-height:1.7;margin-bottom:1.2rem;}
.ep-card-footer{display:flex;align-items:center;justify-content:space-between;}
.ep-card-read{display:inline-flex;align-items:center;gap:.5rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--adark);}
.ep-card-read svg{width:14px;height:14px;transition:transform .2s;}
.ep-card:hover .ep-card-read svg{transform:translateX(3px);}
.ep-card-tipo{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .5rem;border:1px solid var(--g5);color:var(--g4);}
.ep-empty{grid-column:1/-1;text-align:center;padding:4rem;color:var(--g4);}
.ep-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:600;backdrop-filter:blur(6px);}
.ep-modal-bg.open{display:flex;align-items:center;justify-content:center;padding:2rem;}
.ep-modal{background:var(--white);max-width:680px;width:100%;max-height:90vh;overflow-y:auto;position:relative;}
.ep-modal-header{background:var(--black);padding:3rem 3rem 2.5rem;position:relative;}
.ep-modal-close{position:absolute;top:1.2rem;right:1.5rem;background:none;border:none;color:var(--g4);font-size:1.4rem;cursor:pointer;line-height:1;}
.ep-modal-close:hover{color:var(--white);}
.ep-modal-label{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.8rem;}
.ep-modal-title{font-family:var(--fd);font-size:2.2rem;font-weight:300;color:var(--white);line-height:1.15;margin-bottom:.5rem;}
.ep-modal-pasaje{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--g4);}
.ep-modal-body{padding:2.5rem 3rem;}
.ep-modal-body p{font-size:1rem;color:var(--g2);line-height:1.85;margin-bottom:1.2rem;}
.ep-modal-body .verse-block{border-left:3px solid var(--accent);padding:1rem 1.5rem;background:var(--g6);margin:1.5rem 0;}
.ep-modal-body .verse-block p{font-family:var(--fd);font-style:italic;font-size:1.15rem;color:var(--black);margin:0;}
.ep-modal-body .verse-block cite{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--adark);font-style:normal;margin-top:.4rem;display:block;}
.ep-modal-body h3{font-family:var(--fd);font-size:1.4rem;font-weight:600;color:var(--black);margin:2rem 0 .6rem;}

/* LIGHTBOX */
.lb-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:2000;align-items:center;justify-content:center;}
.lb-bg.open{display:flex;}
.lb-img-wrap{position:relative;max-width:90vw;max-height:88vh;display:flex;align-items:center;justify-content:center;}
